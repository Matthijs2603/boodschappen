# Zodra voorkeuren.json verandert (bijvoorbeeld via de pagina), maakt de workflow in
# Matthijs2603/het-mainframe het weekbestand opnieuw, zodat de prijzen kloppen.
name: Prijzen bijwerken na wijziging

on:
  push:
    branches: [main]
    paths: [voorkeuren.json]
  workflow_dispatch:

permissions: {}

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Weekbestand opnieuw laten maken
        env:
          GH_TOKEN: ${{ secrets.MAINFRAME_ACTIONS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "Secret MAINFRAME_ACTIONS_TOKEN ontbreekt"; exit 1; fi
          # via de REST-API, want die vraagt alleen het recht Actions (gh workflow run wil ook de code lezen)
          gh api -X POST repos/Matthijs2603/het-mainframe/actions/workflows/boodschappen-week.yml/dispatches -f ref=main
